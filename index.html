<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Tic Tac Toe - a classic two-player game with light/dark mode support. Accessible and responsive design.">
    <title>Tic Tac Toe - Accessible Game</title>
    <!-- Resource hints for performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style">
    <link rel="preload" href="styles.css" as="style">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light" data-bs-theme="light">
    <!-- Skip to main content link for keyboard users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content" class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h1 class="text-center mb-0">Tic Tac Toe</h1>
                        <button id="theme-toggle" class="btn btn-sm btn-outline-light" aria-label="Toggle dark mode">
                            <i class="fas fa-moon" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="status text-center mb-4">
                            <h2 id="status-message" class="mb-0" aria-live="polite" aria-atomic="true">Player X's Turn</h2>
                            <p class="text-muted mb-0" id="score-display" aria-live="polite">X: 0 | O: 0 | Draws: 0</p>
                        </div>
                        
                        <div class="game-board" role="grid" aria-label="Tic Tac Toe game board">
                            <div class="row g-0" role="row">
                                <button class="col-4 cell border-bottom border-end" data-index="0" aria-label="Cell 1, empty" role="gridcell"></button>
                                <button class="col-4 cell border-bottom border-end" data-index="1" aria-label="Cell 2, empty" role="gridcell"></button>
                                <button class="col-4 cell border-bottom" data-index="2" aria-label="Cell 3, empty" role="gridcell"></button>
                            </div>
                            <div class="row g-0" role="row">
                                <button class="col-4 cell border-bottom border-end" data-index="3" aria-label="Cell 4, empty" role="gridcell"></button>
                                <button class="col-4 cell border-bottom border-end" data-index="4" aria-label="Cell 5, empty" role="gridcell"></button>
                                <button class="col-4 cell border-bottom" data-index="5" aria-label="Cell 6, empty" role="gridcell"></button>
                            </div>
                            <div class="row g-0" role="row">
                                <button class="col-4 cell border-end" data-index="6" aria-label="Cell 7, empty" role="gridcell"></button>
                                <button class="col-4 cell border-end" data-index="7" aria-label="Cell 8, empty" role="gridcell"></button>
                                <button class="col-4 cell" data-index="8" aria-label="Cell 9, empty" role="gridcell"></button>
                            </div>
                        </div>
                        
                        <div class="text-center mt-4">
                            <button id="restart-btn" class="btn btn-primary btn-lg" aria-label="Start new game">
                                <i class="fas fa-sync-alt me-2" aria-hidden="true"></i>New Game
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Game Over Modal -->
    <div class="modal fade" id="gameOverModal" tabindex="-1" aria-hidden="true" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Game Over</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close modal"></button>
                </div>
                <div class="modal-body text-center">
                    <p id="result-message" class="mb-4" aria-live="assertive"></p>
                    <div class="d-grid gap-2">
                        <button id="play-again-btn" class="btn btn-primary" aria-label="Play again">Play Again</button>
                        <button class="btn btn-outline-secondary" data-bs-dismiss="modal" aria-label="Close modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" as="script">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Custom JS -->
    <script src="script.js" defer></script>
</body>
</html>
